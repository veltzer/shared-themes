# RSConstruct configuration for shared-themes.
#
# Builds the generated artifacts (themes.css, themes.json, theme.py,
# manim_themes.py, marp/*.css, latex/*.tex, docx/*.docx) from the single
# source of truth (themes.yaml),
# and diagram_theme.py plus diagram-themes.json from diagram-themes.yaml.
#
#   rsconstruct build              # regenerate if themes.yaml changed
#   rsconstruct status             # show what's stale
#   rsconstruct clean              # remove generated outputs

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true
# parallel = 0

# Every themes.yaml generator goes through scripts/themes_common.py (the
# loader and validator), so it is an input of each.
#
# The generators are Python scripts, so each names python in required_tools:
# that is what lets a sandboxed build (execution_model = "sandbox") accept
# the bytecode Python writes into __pycache__ directories.

# ─── Generate themes.css from themes.yaml ───
[processor.explicit.generic.css]
command = "scripts/yaml_to_css.py"
required_tools = ["python"]
# The two theme scripts are inputs because the generator checks that the
# defaults they name are the ones themes.yaml sets.
inputs = [
    "themes.yaml",
    "scripts/yaml_to_css.py",
    "scripts/themes_common.py",
    "theme-switcher.js",
    "theme-onload.js",
]
output_files = ["themes.css"]

# ─── Generate themes.json from themes.yaml ───
[processor.explicit.generic.json]
command = "scripts/yaml_to_json.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_json.py", "scripts/themes_common.py"]
output_files = ["themes.json"]

# ─── Generate theme.py from themes.yaml ───
[processor.explicit.generic.python]
command = "scripts/yaml_to_python.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_python.py", "scripts/themes_common.py"]
output_files = ["theme.py"]

# ─── Generate manim_themes.py from themes.yaml ───
[processor.explicit.generic.manim]
command = "scripts/yaml_to_manim.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_manim.py", "scripts/themes_common.py"]
output_files = ["manim_themes.py"]

# ─── Generate marp/<theme>.css from themes.yaml ───
# One marp theme per palette. The output list names every theme: adding a
# theme to themes.yaml means adding its file here and to the sync check.
[processor.explicit.generic.marp]
command = "scripts/yaml_to_marp.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_marp.py", "scripts/themes_common.py"]
output_files = [
    "marp/azure.css",
    "marp/paper.css",
    "marp/midnight.css",
    "marp/nord.css",
    "marp/solarized.css",
    "marp/rosepine.css",
]

# ─── Generate latex/<theme>.tex from themes.yaml ───
# One LaTeX preamble theme per palette, for xelatex/lualatex documents
# (pandoc's PDF output). It checks the font files it names exist in fonts/.
[processor.explicit.generic.latex]
command = "scripts/yaml_to_latex.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_latex.py", "scripts/themes_common.py"]
input_globs = ["fonts/*.ttf"]
output_files = [
    "latex/azure.tex",
    "latex/paper.tex",
    "latex/midnight.tex",
    "latex/nord.tex",
    "latex/solarized.tex",
    "latex/rosepine.tex",
]

# ─── Generate docx/<theme>.docx from themes.yaml ───
# One Word reference document per light palette (pandoc's --reference-doc).
# Dark palettes get none: pandoc drops a reference document's page
# background, so their light text would land on a white page.
[processor.explicit.generic.docx]
command = "scripts/yaml_to_docx.py"
required_tools = ["python"]
inputs = ["themes.yaml", "scripts/yaml_to_docx.py", "scripts/themes_common.py"]
output_files = [
    "docx/azure.docx",
    "docx/paper.docx",
    "docx/solarized.docx",
]

# ─── Generate diagram_theme.py and diagram-themes.json from diagram-themes.yaml ───
# The palette variants are derived from themes.yaml, so that is an input too.
[processor.explicit.generic.diagram_python]
command = "scripts/diagram_themes_to_python.py"
required_tools = ["python"]
inputs = [
    "diagram-themes.yaml",
    "themes.yaml",
    "scripts/diagram_themes_to_python.py",
    "scripts/themes_common.py",
]
output_files = ["diagram_theme.py", "diagram-themes.json"]

[processor.checker.ruff]
src_dirs = ["scripts"]
src_files = ["shared_themes.py"]

# type-check the Python files with pyrefly (policy: [tool.pyrefly] in pyproject.toml)
[processor.checker.pyrefly]
src_dirs = ["scripts"]
src_files = ["shared_themes.py"]

# Lint the hand-written stylesheets plus the allowlist fixture, which catches
# drift between the generated themes.css and design-tokens.grit. themes.css
# and marp/*.css are generated and hold the raw hex values, so they are not
# linted.
[processor.checker.biome]
src_files = ["base.css", "components.css", "test_tokens_allowlist.css", "typography.css"]
src_exclude_paths = ["themes.css"]
src_extensions = [".css"]
args = ["--config-path", "biome-tokens.jsonc"]
dep_inputs = ["biome-tokens.jsonc", "design-tokens.grit"]

# No [dependencies] block: biome is a standalone binary from the tool
# registry, and pyyaml, which the generators in scripts/ import, comes from
# pyproject.toml / uv.lock.

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_files = ["themes.yaml", "diagram-themes.yaml", ".yamllint.yaml"]
src_dirs = [".github"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_files = ["theme-switcher.js", "theme-onload.js"]
args = ["-c", ".oxlintrc.repo.json"]
dep_inputs = [".oxlintrc.repo.json"]

# lint the TOML files of the repo with taplo
[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the Lua configuration with luacheck (policy: .luacheckrc)
[processor.checker.iluacheck]
src_dirs = ["config"]
