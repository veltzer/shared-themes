# RSConstruct configuration for shared-themes.
#
# Builds the generated artifacts (themes.css, themes.json, theme.py,
# manim_themes.py, marp/*.css) from the single source of truth (themes.yaml),
# and diagram_theme.py from diagram-themes.yaml.
#
#   rsconstruct build              # regenerate if themes.yaml changed
#   rsconstruct status             # show what's stale
#   rsconstruct clean              # remove generated outputs

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true
# parallel = 0

# Every themes.yaml generator goes through scripts/themes_common.py (the
# loader and validator), so it is an input of each.

# ─── Generate themes.css from themes.yaml ───
[processor.explicit.generic.css]
command = "scripts/yaml_to_css.py"
inputs = ["themes.yaml", "scripts/yaml_to_css.py", "scripts/themes_common.py"]
output_files = ["themes.css"]

# ─── Generate themes.json from themes.yaml ───
[processor.explicit.generic.json]
command = "scripts/yaml_to_json.py"
inputs = ["themes.yaml", "scripts/yaml_to_json.py", "scripts/themes_common.py"]
output_files = ["themes.json"]

# ─── Generate theme.py from themes.yaml ───
[processor.explicit.generic.python]
command = "scripts/yaml_to_python.py"
inputs = ["themes.yaml", "scripts/yaml_to_python.py", "scripts/themes_common.py"]
output_files = ["theme.py"]

# ─── Generate manim_themes.py from themes.yaml ───
[processor.explicit.generic.manim]
command = "scripts/yaml_to_manim.py"
inputs = ["themes.yaml", "scripts/yaml_to_manim.py", "scripts/themes_common.py"]
output_files = ["manim_themes.py"]

# ─── Generate marp/<theme>.css from themes.yaml ───
# One marp theme per palette. The output list names every theme: adding a
# theme to themes.yaml means adding its file here and to the sync check.
[processor.explicit.generic.marp]
command = "scripts/yaml_to_marp.py"
inputs = ["themes.yaml", "scripts/yaml_to_marp.py", "scripts/themes_common.py"]
output_files = [
    "marp/azure.css",
    "marp/paper.css",
    "marp/midnight.css",
    "marp/nord.css",
    "marp/solarized.css",
    "marp/rosepine.css",
]

# ─── Generate diagram_theme.py from diagram-themes.yaml ───
[processor.explicit.generic.diagram_python]
command = "scripts/diagram_themes_to_python.py"
inputs = ["diagram-themes.yaml", "scripts/diagram_themes_to_python.py"]
output_files = ["diagram_theme.py"]

# ─── Committed generated files must match their YAML sources ───
# The generators above rewrite the artifacts; if a committed copy differs
# from what was just generated, or a generated file is untracked, a source
# and its outputs have drifted.
[processor.explicit.generic.generated_in_sync]
command = "scripts/check_generated_in_sync.py"
args = [
    "out/generated_in_sync.stamp",
    "themes.css",
    "themes.json",
    "theme.py",
    "manim_themes.py",
    "marp/azure.css",
    "marp/paper.css",
    "marp/midnight.css",
    "marp/nord.css",
    "marp/solarized.css",
    "marp/rosepine.css",
    "diagram_theme.py",
]
# .git/index is an input because the check compares the working tree with the
# index: a change to what is committed must re-run it even when the generated
# content is unchanged, otherwise a cached pass would hide the drift.
inputs = [
    "themes.css",
    "themes.json",
    "theme.py",
    "manim_themes.py",
    "marp/azure.css",
    "marp/paper.css",
    "marp/midnight.css",
    "marp/nord.css",
    "marp/solarized.css",
    "marp/rosepine.css",
    "diagram_theme.py",
    "scripts/check_generated_in_sync.py",
    ".git/index",
]
output_files = ["out/generated_in_sync.stamp"]

[processor.checker.ruff]
src_dirs = ["scripts"]
src_files = ["shared_themes.py"]

# Lint the hand-written stylesheets plus the allowlist fixture, which catches
# drift between the generated themes.css and design-tokens.grit. themes.css
# and marp/*.css are generated and hold the raw hex values, so they are not
# linted.
[processor.checker.biome]
src_files = ["base.css", "components.css", "test_tokens_allowlist.css", "typography.css"]
src_exclude_paths = ["themes.css"]
src_extensions = [".css"]
args = ["--config-path", "biome-tokens.jsonc"]
dep_inputs = ["biome-tokens.jsonc", "design-tokens.grit"]

# No [dependencies] block: biome is a standalone binary from the tool
# registry, and pyyaml, which the generators in scripts/ import, comes from
# pyproject.toml / uv.lock.

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_dirs = ["doc"]
src_files = ["README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_files = ["themes.yaml", "diagram-themes.yaml"]
src_dirs = [".github"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_files = ["theme-switcher.js"]
args = ["-c", ".oxlintrc.json"]
