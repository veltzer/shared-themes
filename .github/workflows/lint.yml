name: lint
on: [push, pull_request]

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install rsconstruct
        run: |
          gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
          chmod +x /usr/local/bin/rsconstruct
          rsconstruct version
        env:
          GH_TOKEN: ${{ github.token }}
      # stylelint@17 / pyyaml come from rsconstruct.toml [dependencies];
      # nothing is installed by hand.
      - name: install
        run: rsconstruct tools install-deps
      - name: Lint own CSS files
        run: stylelint base.css typography.css components.css
      - name: Lint allowlist fixture (catches drift between themes.css and stylelint config)
        run: stylelint test_stylelint_allowlist.css

  generated-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install rsconstruct
        run: |
          gh release download --repo veltzer/rsconstruct --pattern 'rsconstruct-linux-x86_64' --output /usr/local/bin/rsconstruct
          chmod +x /usr/local/bin/rsconstruct
          rsconstruct version
        env:
          GH_TOKEN: ${{ github.token }}
      # stylelint@17 / pyyaml come from rsconstruct.toml [dependencies];
      # nothing is installed by hand.
      - name: install
        run: rsconstruct tools install-deps
      - name: Regenerate themes.css and theme.py from themes.yaml
        run: |
          python3 scripts/yaml_to_css.py
          python3 scripts/yaml_to_python.py
      - name: Fail if generated files are out of sync with themes.yaml
        run: git diff --exit-code -- themes.css theme.py
